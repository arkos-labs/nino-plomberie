<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grad)"/>

  <!-- Accent bar -->
  <rect width="1200" height="8" fill="#f97316"/>

  <!-- Main text -->
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" letter-spacing="-2">
    Nino Plomberie
  </text>

  <!-- Tagline -->
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="36" fill="#e0f2fe">
    Plombier Muret &amp; Toulouse
  </text>

  <!-- Features -->
  <g font-family="Arial, sans-serif" font-size="28" fill="white">
    <text x="60" y="300">✓ 24h/24 · 7j/7</text>
    <text x="60" y="370">✓ Garantie 2 ans</text>
    <text x="60" y="440">✓ Devis gratuit</text>
  </g>

  <!-- Phone number -->
  <text x="60" y="560" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#fbbf24">
    📞 06 50 57 96 20
  </text>

  <!-- Badge -->
  <rect x="900" y="40" width="240" height="120" rx="8" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="2"/>
  <text x="1020" y="85" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    4.4/5
  </text>
  <text x="1020" y="115" font-family="Arial, sans-serif" font-size="16" fill="#e0f2fe" text-anchor="middle">
    78 avis
  </text>
</svg>
